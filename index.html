<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06111f">
<title>BTC 自动盯盘 V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111f;color:#eaf4ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:22px;font-weight:800}.brand b{color:#18a8ff}.status{font-size:12px;color:#35e59a}.card{background:#091a2d;border:1px solid #163653;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 8px 30px #0003}.price{font-size:34px;font-weight:800}.green{color:#35e59a}.red{color:#ff5574}.muted{color:#829ab2;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#071426;border-radius:12px;padding:12px}.metric .v{font-size:20px;font-weight:700;margin-top:5px}.bars{display:flex;height:14px;border-radius:10px;overflow:hidden;background:#14283c;margin:10px 0}.buy{background:#35e59a}.sell{background:#ff5574}.tf{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tf button{border:1px solid #1a3b5b;background:#0b2036;color:#d7e7f5;padding:10px 4px;border-radius:10px;font-weight:700}.tf button.active{background:#078ef0;border-color:#078ef0}.signal{display:flex;align-items:center;gap:14px;padding:12px;border-radius:13px;background:#071426}.badge{font-size:22px;font-weight:800}.alert{border:1px solid #8e2940;background:#25121c}.alert.ok{border-color:#195c4b;background:#0c201d}.reason{line-height:1.7;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.smallgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.barline{height:7px;background:#14283c;border-radius:8px;overflow:hidden}.barline i{display:block;height:100%;background:#18a8ff}.footer{text-align:center;color:#607b94;font-size:11px;padding:16px}.err{color:#ffb2bf;font-size:12px}.loading{opacity:.7}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.grid .metric:first-child{grid-column:1/-1}.price{font-size:30px}.tf{grid-template-columns:repeat(5,1fr)}.tf button{font-size:11px}.smallgrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand">₿ BTC 自动盯盘 <b>V2</b></div><div class="status">● <span id="status">实时数据</span></div></div>

<section class="card">
 <div class="muted">BTC-USDT 永续 · OKX 公共行情</div>
 <div class="row" style="align-items:end;margin-top:5px"><div><div id="price" class="price loading">--</div><div id="change" class="muted">等待数据…</div></div><div class="muted" id="updated">--</div></div>
</section>

<section class="grid">
 <div class="metric"><div class="muted">OI 合约持仓量</div><div id="oi" class="v">--</div><div id="oiChg" class="muted">--</div></div>
 <div class="metric"><div class="muted">资金费率</div><div id="funding" class="v">--</div><div class="muted">当前费率</div></div>
 <div class="metric"><div class="muted">24h 成交量</div><div id="vol" class="v">--</div><div class="muted">USDT</div></div>
</section>

<section class="card">
 <div class="row"><b>多空主动成交压力</b><span class="muted">近端估算</span></div>
 <div class="bars"><div id="buyBar" class="buy" style="width:50%"></div><div id="sellBar" class="sell" style="width:50%"></div></div>
 <div class="row"><span class="green">买入（多） <b id="buyPct">50%</b></span><span class="red">卖出（空） <b id="sellPct">50%</b></span></div>
</section>

<section id="dump" class="card alert ok">
 <div class="row"><b>⚡ 硬盘/砸盘瞬间识别</b><span id="dumpTime" class="muted">监测中</span></div>
 <div id="dumpText" class="reason">正在建立基准数据……</div>
</section>

<section class="card">
 <div class="row"><b>多周期方向分析</b><span class="muted">1 / 5 / 15 / 30 / 60 分钟</span></div>
 <div class="tf" style="margin-top:10px">
  <button class="active" onclick="selectTF(1,this)">1分钟</button><button onclick="selectTF(5,this)">5分钟</button><button onclick="selectTF(15,this)">15分钟</button><button onclick="selectTF(30,this)">30分钟</button><button onclick="selectTF(60,this)">60分钟</button>
 </div>
 <div id="tfDetail" class="signal" style="margin-top:10px"><div id="tfBadge" class="badge">观望</div><div id="tfReason" class="reason">等待 K 线数据</div></div>
</section>

<section class="card">
 <div class="row"><b>AI 智能分析结论</b><span class="muted">规则引擎 · 实时更新</span></div>
 <div class="signal" style="margin-top:10px"><div id="overall" class="badge">观望</div><div id="overallReason" class="reason">正在综合价格、OI、资金费率与多周期结构。</div></div>
</section>

<section class="card">
 <b>五周期状态</b>
 <div id="multi" class="smallgrid" style="margin-top:10px"></div>
</section>

<div id="error" class="err"></div>
<div class="footer">仅作市场数据分析，不自动下单。数据来自 OKX 公共 API。请自行判断风险。</div>
</div>
<script>
const BASE='https://www.okx.com';
let state={price:null,prevPrice:null,oi:null,prevOI:null,funding:null,vol:null,candles:{},scores:{}}, selected=1;

async function get(path){const r=await fetch(BASE+path,{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();if(j.code!=='0')throw Error(j.msg||'API error');return j.data}
function fmt(n,d=2){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d})}
function signClass(n){return n>0?'green':n<0?'red':''}

async function loadMarket(){
 try{
  const [t,oi,f]=await Promise.all([
   get('/api/v5/market/ticker?instId=BTC-USDT-SWAP'),
   get('/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP'),
   get('/api/v5/public/funding-rate?instType=SWAP&instId=BTC-USDT-SWAP')
  ]);
  const x=t[0]; state.prevPrice=state.price; state.price=+x.last; state.vol=+x.vol24h;
  state.prevOI=state.oi; state.oi=+oi[0].oi; state.funding=+f[0].fundingRate;
  document.getElementById('price').textContent=fmt(state.price,2);
  const c=+x.sodUtc0?0:((state.price-(+x.open24h||state.price))/(+x.open24h||state.price)*100);
  const ce=document.getElementById('change');ce.textContent=(c>=0?'+':'')+c.toFixed(2)+'% · 24h';
  ce.className='muted '+signClass(c); document.getElementById('oi').textContent=fmt(state.oi/1e6,2)+'M';
  const oc=state.prevOI?((state.oi/state.prevOI-1)*100):0; document.getElementById('oiChg').textContent=(oc>=0?'+':'')+oc.toFixed(2)+'%';
  document.getElementById('oiChg').className='muted '+signClass(oc);
  const fr=state.funding*100;document.getElementById('funding').textContent=(fr>=0?'+':'')+fr.toFixed(4)+'%';
  document.getElementById('funding').className='v '+signClass(fr);
  document.getElementById('vol').textContent=fmt(state.vol/1e6,1)+'M';
  document.getElementById('updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  document.getElementById('status').textContent='实时数据';
  document.getElementById('price').classList.remove('loading');
  updatePressure(c,oc);
  updateDump(c,oc);
  analyzeOverall();
 }catch(e){document.getElementById('status').textContent='连接异常';document.getElementById('error').textContent='数据连接失败：'+e.message+'（可稍后刷新重试）'}
}

function updatePressure(c,oc){
 let buy=50+c*3+oc*1.5+(state.funding||0)*1200;buy=Math.max(5,Math.min(95,buy));let sell=100-buy;
 document.getElementById('buyBar').style.width=buy+'%';document.getElementById('sellBar').style.width=sell+'%';
 document.getElementById('buyPct').textContent=buy.toFixed(1)+'%';document.getElementById('sellPct').textContent=sell.toFixed(1)+'%';
}
function updateDump(c,oc){
 const box=document.getElementById('dump'), text=document.getElementById('dumpText');
 let hit=c<-1.0 || (c<-.5&&oc>0.4);
 if(hit){box.className='card alert';text.innerHTML='价格快速下跌，且 OI/成交状态出现异常变化。<b class="red">疑似砸盘</b>，等待下一根 K 线确认，避免单点追单。';document.getElementById('dumpTime').textContent='⚠ 已触发'}
 else {box.className='card alert ok';text.textContent='暂未发现满足阈值的瞬时砸盘信号，持续监测价格、OI 与成交变化。';document.getElementById('dumpTime').textContent='监测中'}
}

async function loadTF(tf){
 try{
  const bar=tf===1?'1m':tf+'m';
  const d=await get('/api/v5/market/candles?instId=BTC-USDT-SWAP&bar='+bar+'&limit=80');
  const a=d.reverse().map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
  state.candles[tf]=a; const closes=a.map(x=>x.c), n=closes.length;
  const last=closes[n-1], p5=closes[Math.max(0,n-6)], p20=closes[Math.max(0,n-21)];
  const short=(last/p5-1)*100, mid=(last/p20-1)*100;
  let score=short*2+mid; state.scores[tf]=score;
  return {last,short,mid,score};
 }catch(e){return null}
}
function label(s){return s>0.7?'偏多':s<-0.7?'偏空':'观望'}
function detail(r){if(!r)return'等待 K 线数据';return `近${selected<=5?5:20}根 K 线变化 ${r.mid>=0?'+':''}${r.mid.toFixed(2)}%，短线动量 ${r.short>=0?'+':''}${r.short.toFixed(2)}%。结合 OI 后仅作为辅助信号。`}
async function refreshTFs(){
 for(const tf of [1,5,15,30,60]) await loadTF(tf);
 const multi=document.getElementById('multi');multi.innerHTML='';
 for(const tf of [1,5,15,30,60]){const s=state.scores[tf]||0;const d=document.createElement('div');d.className='metric';d.innerHTML=`<div class="muted">${tf}分钟</div><div class="${s>0.7?'green':s<-0.7?'red':''}" style="font-size:18px;font-weight:800;margin-top:5px">${label(s)}</div><div class="barline" style="margin-top:8px"><i style="width:${Math.min(100,Math.max(4,50+s*12))}%"></i></div>`;multi.appendChild(d)}
 renderSelected();
 analyzeOverall();
}
async function renderSelected(){const r=await loadTF(selected);document.getElementById('tfBadge').textContent=label(r?.score||0);document.getElementById('tfBadge').className='badge '+((r?.score||0)>0.7?'green':(r?.score||0)<-0.7?'red':'');document.getElementById('tfReason').textContent=detail(r)}
function selectTF(tf,btn){selected=tf;document.querySelectorAll('.tf button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderSelected()}
function analyzeOverall(){
 const vals=[1,5,15,30,60].map(x=>state.scores[x]||0), avg=vals.reduce((a,b)=>a+b,0)/vals.length;
 const o=document.getElementById('overall'), r=document.getElementById('overallReason');o.textContent=label(avg);o.className='badge '+(avg>.7?'green':avg<-.7?'red':'');
 const aligned=vals.filter(x=>x>.7).length>=4||vals.filter(x=>x<-.7).length>=4;
 r.textContent=aligned?`多周期方向较集中：${label(avg)}。当前结论由 1/5/15/30/60 分钟结构综合得出；若出现砸盘信号，应等待确认。`:`多周期存在分歧，当前更适合视为观望区间。不要仅凭单一指标决定方向。`;
}
loadMarket();refreshTFs();setInterval(loadMarket,5000);setInterval(refreshTFs,30000);
</script></body></html>
